# Full stack: postgres + redis + one-shot migrate + web + worker.
# Run everything with:  docker compose up --build
# The web app is then at http://localhost:3000 and the worker processes crawls.
#
# web/worker/migrate share one image (built from ./Dockerfile). DATABASE_URL/REDIS_URL
# point at the in-network service names (postgres/redis), overriding any host .env.

x-app-env: &app-env
  DATABASE_URL: "postgresql://crawler:crawler@postgres:5432/crawler?schema=public"
  REDIS_URL: "redis://redis:6379"
  NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-dev-secret-please-change-2f8a1c9e4b7d6053}"
  NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
  WORKER_CONCURRENCY: "3"
  CRAWL_DEFAULT_USER_AGENT: "${CRAWL_DEFAULT_USER_AGENT:-Krawlify/1.0 (+https://krawlify.com)}"
  # No remote-browser env vars here on purpose: the bot-protection bypass reads its
  # endpoint, auth token and proxy from the crawl's own settings (the form fields) only.
  # The worker still joins the browser networks below so those hosts are reachable by name
  # (e.g. http://cloakbrowser:9222, ws://stealth-browser:3000/).
  NODE_ENV: "production"

# Built locally by default. Set IMAGE to a published tag (and `docker pull` it first) to
# run the release image instead of building: IMAGE=kamenarov/krawlify-app:edge
x-app-build: &app-build
  build: .
  image: "${IMAGE:-krawlify:latest}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: crawler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Separate Playwright browser server used by the bot-protection bypass. Point a crawl's
  # connection field at ws://playwright:3001/ to use it. Runs a headful
  # Chromium under Xvfb. Optional — only needed for bypass crawls.
  #
  # NOTE on proxies: to use the per-context proxy feature, add `proxy:{server:'per-context'}`
  # to launchServer below (Playwright requires a global proxy for per-context proxies).
  # When you do, EVERY crawl on this server must set a proxy. For mixed use, run one
  # server without a global proxy (no-proxy crawls) and a second with it (proxy crawls).
  #
  # Disabled by default (bypass functionality lives in a separate app). Start it
  # explicitly with: docker compose --profile playwright up -d
  playwright:
    profiles: ["playwright"]
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    restart: unless-stopped
    command:
      - sh
      - -lc
      - >
        xvfb-run -a node -e "const {chromium}=require('playwright');
        chromium.launchServer({headless:false, port:3001, wsPath:'/',
        args:['--no-sandbox','--disable-blink-features=AutomationControlled','--disable-dev-shm-usage']})
        .then(s=>console.log('[playwright] listening on',s.wsEndpoint()))
        .catch(e=>{console.error(e);process.exit(1)})"
    ports:
      - "3001:3001"

  # One-shot: apply migrations, then exit. web/worker wait for it to finish.
  migrate:
    <<: *app-build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-build
    command: ["npm", "run", "start"]
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *app-build
    # The image entrypoint starts Xvfb so the headful (headless:false) browser used by
    # the bot-protection bypass has a virtual display.
    command: ["npm", "run", "worker:start"]
    environment:
      <<: *app-env
    # Also on the remote-browser networks so CDP crawls can resolve those containers
    # by name (`cloakbrowser`, `stealth-browser`) instead of by IP.
    networks:
      - default
      - browser
      - stealth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  default:
  # Networks of the remote browsers, each created by its own compose project. Declared
  # external so the worker can reach those containers by name for CDP crawls.
  browser:
    name: crawer_app_browser_default # cloakbrowser
    external: true
  stealth:
    name: browser_default # stealth-browser
    external: true

volumes:
  pgdata:
  redisdata:
