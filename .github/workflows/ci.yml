name: CI

# Nothing is published until the checks pass — the docker job needs the check job, so a
# broken typecheck or a failing test can never become a :edge tag on Docker Hub.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — the last push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The Prisma client is generated code, not committed, so typecheck and build both
      # need it before they can resolve @prisma/client.
      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The unit suite touches neither Postgres nor Redis, but the build imports modules
      # that construct clients at load time, so give them syntactically valid URLs.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: ci-build-secret-not-used-at-runtime
          NEXTAUTH_URL: http://localhost:3000

  docker:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated, and a Next.js build under QEMU is slow — several times the
      # amd64 cost. Worth it on a release so the image runs unmodified on Apple silicon
      # and Graviton hosts; not worth it on every pull request, which builds amd64 only.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3

      # Pull requests from forks cannot read secrets, and an unreviewed PR should not be
      # able to publish anyway — those runs build the image and throw it away.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: kamenarov/krawlify-app
          # main -> :edge, v1.2.3 -> :1.2.3, :1.2, :1, :latest
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          # `latest` follows the newest release tag, never main — so pulling it gets
          # something that was deliberately cut, not the last commit that happened to pass.
          # `auto` also keeps it off pre-releases (v1.0.0-rc.1).
          flavor: latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true # a missing scope here must not fail a good build
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kamenarov/krawlify-app
          readme-filepath: ./README.md

  # Cutting a release is `git tag v1.2.3 && git push origin v1.2.3` — everything below is
  # automatic. It runs after docker on purpose: a release whose image failed to publish
  # would send people to a pull that does not exist.
  release:
    name: GitHub release
    needs: [check, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --generate-notes needs the history to diff against the last tag

      # Prefer the hand-written CHANGELOG section for this version; fall back to
      # generated commit notes when there isn't one, so a release is never blocked on it.
      - id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # Everything between "## [1.2.3]" and the next "## " heading. Matched by prefix
          # rather than regex — the brackets in the heading are a character class if the
          # escaping slips, which silently matches nothing.
          # The last section runs to EOF, so stop at the link definitions too.
          awk -v h="## [$version]" '
            index($0, h) == 1 { found = 1; next }
            found && (/^## / || /^\[.*\]: http/) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if grep -q '[^[:space:]]' release-notes.md; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG section for $version — using generated commit notes."
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

          cat >> release-notes.md <<EOF

          ## Docker

          \`\`\`bash
          docker pull kamenarov/krawlify-app:${version}
          IMAGE=kamenarov/krawlify-app:${version} docker compose up -d
          \`\`\`

          Also tagged \`:latest\`. Published for linux/amd64 and linux/arm64.
          EOF

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --notes-file release-notes.md)
          # gh appends generated notes to the file's contents rather than replacing them.
          if [ "${{ steps.notes.outputs.generate }}" = "true" ]; then
            args+=(--generate-notes)
          fi
          # A hyphen means a pre-release: v1.0.0-rc.1, v2.0.0-beta.
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}"
